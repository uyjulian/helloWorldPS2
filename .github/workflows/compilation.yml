name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_dispatch: {}

env:
  CMAKE_GENERATOR: Ninja
  DEBIAN_FRONTEND: noninteractive
  TZ: Japan

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2sdk:latest
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          apk add build-base git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile project
        run: |
          make -j $(getconf _NPROCESSORS_ONLN) clean 
          make -j $(getconf _NPROCESSORS_ONLN)

      - name: Get short SHA
        id: slug
        run: |
          printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.slug.outputs.sha8 }}
          path: "*.elf"

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:20.04
      options: "--user 0"
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifact
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Set up p7zip
        run: "apt-get -y update && apt-get -y -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' install p7zip-full"
      - name: Prepare artifacts for release
        run: "7z a -tzip ${{ github.event.repository.name }}-${{ github.ref_name }}.zip *.elf"
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: "${{ github.event.repository.name }}-${{ github.ref_name }}.zip"
